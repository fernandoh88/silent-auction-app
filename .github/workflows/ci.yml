name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend Tests And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_ADMIN_EMAIL: admin@example.com
          REACT_APP_FIREBASE_API_KEY: ci-placeholder
          REACT_APP_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: ci-placeholder
          REACT_APP_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          REACT_APP_FIREBASE_APP_ID: ci-placeholder

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: silent-auction-server:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: silent-auction-client:ci
          build-args: |
            REACT_APP_API_URL=http://localhost:5000
            REACT_APP_ADMIN_EMAIL=admin@example.com
            REACT_APP_FIREBASE_API_KEY=ci-placeholder
            REACT_APP_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
            REACT_APP_FIREBASE_PROJECT_ID=ci-placeholder
            REACT_APP_FIREBASE_STORAGE_BUCKET=ci-placeholder.appspot.com
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=000000000000
            REACT_APP_FIREBASE_APP_ID=ci-placeholder
